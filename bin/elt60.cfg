<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <paths>
    <path name="lscripts">../lscripts60</path>
  </paths>
  <prompts>
     <prompt name="help">Type help to list all available commands</prompt>
  </prompts>
  <commands>
     <command name="quit">^quit;</command>
     <command name="help">^list commands;</command>
     <command name="eval" arg="current_expression" help="eval <expr>">^load repl @script; ^eval @script;</command>
     <command name="exec-line" arg="current_expression" help="exec line <expr>">^load exec @script; ^eval @script;</command>
     <command name="exec-file" arg="script_path" help="exec file <path>">^file eval @script_path;</command>
     <command name="set" variable="name" arg="current_expression" help="set @<name> := <expr>">^load get_var @script; ^set @name @script; ^load set_var @script; ^eval @script;</command>
     <command name="gen-linelist" arg="list_path" help="gen linelist <path-to-list>">^ask @script_path "the path to the text template";^ask @output_path "the path to the output";^load textgen_ln @script;^eval @script;</command>
     <command name="gen-console" arg="name" help="gen console <program-name>">^copy @namespace @name;^ask @namespace "the root namespace";^ask @output_path "the output path"; ^load console @script; ^eval @script;</command>
     <command name="gen-repl" arg="name" help="gen repl <program-name>">^copy @namespace @name;^ask @namespace "the root namespace";^ask @output_path "the output path"; ^load repl_console @script; ^eval @script;</command>
     <command name="gen-library" arg="name" help="gen library <library-name>">^copy @namespace @name;^ask @namespace "the root namespace";^ask @output_path "the output path"; ^load library @script; ^eval @script;</command>
  </commands>
</configuration>
