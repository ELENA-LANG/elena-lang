<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <commands>
     <command name="quit">^quit;</command>
     <command name="help">^list commands;</command>
     <command name="eval" arg="current_expression">^load repl @script; ^eval @script;</command>
     <command name="set" variable="name" arg="current_expression">^load get_var @script; ^set @name @script; ^load set_var @script; ^eval @script;</command>
  </commands>
</configuration>
