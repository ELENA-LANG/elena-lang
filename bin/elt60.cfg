<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <paths>
    <path name="lscripts">../lscripts60</path>
  </paths>
  <commands>
     <command name="quit">^quit;</command>
     <command name="help">^list commands;</command>
     <command name="eval" arg="current_expression">^load repl @script; ^eval @script;</command>
     <command name="exec-line" arg="current_expression">^load exec @script; ^eval @script;</command>
     <command name="exec-file" arg="script_path">^file eval @script_path;</command>
     <command name="set" variable="name" arg="current_expression">^load get_var @script; ^set @name @script; ^load set_var @script; ^eval @script;</command>
     <command name="gen-linelist" arg="list_path">^ask @script_path "the path to the text template";^ask @output_path "the path to the output";^load textgen_ln @script;^eval @script;</command>
  </commands>
</configuration>
